<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Lumine</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   LUMINE — Design System
   ═══════════════════════════════════════════ */

:root {
  --g: #1f3d2b; --au: #b8935a; --bg: #fbf8f1; --s: #fff; --s2: #f3ede0;
  --t: #22301f; --m: #6c7568; --a: #b8935a; --ln: #e8e0cf;
  --ok: #4f7a3a; --no: #a63d3d; --bdno: #f6e2e0; --bdok: #e3eedc;
  --sh1: 0 1px 2px rgba(31,61,43,.06);
  --sh2: 0 4px 14px rgba(31,61,43,.08);
  --sh3: 0 12px 32px rgba(31,61,43,.14);
  --r: 12px; --r-sm: 8px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top,0px);
  padding-bottom: env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark) {
  :root {
    --g: #2f5a41; --bg: #101a14; --s: #17251c; --s2: #1f3026;
    --t: #efe9da; --m: #a3ad9f; --ln: #2a3a2f;
    --ok: #7fc8a0; --no: #e87c7c; --bdno: #4a2326; --bdok: #22382d;
    --sh1: 0 1px 2px rgba(0,0,0,.3);
    --sh2: 0 4px 14px rgba(0,0,0,.4);
    --sh3: 0 12px 32px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }

body {
  margin: 0;
  background: radial-gradient(circle at 20% -10%, rgba(184,147,90,.06), transparent 40%),
              radial-gradient(circle at 80% 110%, rgba(31,61,43,.05), transparent 40%),
              var(--bg);
  background-attachment: fixed;
  color: var(--t);
  font: 300 15px/1.55 Jost, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3 {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-weight: 500; letter-spacing: .02em; line-height: 1.15;
}

/* ── HEADER ─────────────────────────── */
header {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px;
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--ln);
  position: sticky; top: 0; z-index: 20;
}
#mb {
  background: none; color: var(--au); font-size: 24px; line-height: 1;
  padding: 6px 8px; flex: none; text-transform: none; letter-spacing: 0;
  border-radius: var(--r-sm); transition: background .2s;
}
#mb:hover { background: var(--s2); }
#ov {
  position: fixed; inset: 0; background: rgba(10,20,14,.55);
  backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
  z-index: 25; display: none;
}
#ov.o { display: block; animation: fadeIn .2s ease; }
header h1 {
  font: 500 30px/1 'Cormorant Garamond', Georgia, serif;
  color: var(--g); margin: 0; display: flex; align-items: center; gap: 8px;
  letter-spacing: .02em;
}
header h1::before {
  content: "✦"; color: var(--au); font-size: 18px;
  animation: twinkle 4s ease-in-out infinite;
}
@media (prefers-color-scheme:dark) { header h1 { color: var(--au); } }
header small {
  display: block; margin-top: 2px; letter-spacing: .35em;
  text-transform: uppercase; font-size: 9.5px; color: var(--m);
}
#tt {
  margin-left: auto; color: var(--m); font-weight: 400;
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-style: italic; font-size: 16px;
  max-width: 40%; text-align: right;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ── MAIN ───────────────────────────── */
main { padding: 18px 14px calc(92px + env(safe-area-inset-bottom,0px)); }

/* ── NAV ────────────────────────────── */
nav {
  position: fixed; top: 0; bottom: 0; left: 0; width: 260px; max-width: 82%;
  display: flex; flex-direction: column;
  background: var(--bg);
  background-image: radial-gradient(circle at 0% 0%, rgba(184,147,90,.08), transparent 50%);
  border-right: 1px solid var(--ln);
  padding: calc(env(safe-area-inset-top,0px) + 28px) 0 24px;
  z-index: 30; transform: translateX(-100%);
  transition: transform .28s cubic-bezier(.4,0,.2,1);
}
nav.o { transform: none; box-shadow: var(--sh3); }
nav button {
  background: none; border: 0; border-radius: 0; color: var(--m);
  padding: 16px 24px; font-size: 13px; font-weight: 400; text-align: left;
  letter-spacing: .12em; text-transform: uppercase;
  transition: color .2s, background .2s;
  position: relative; box-shadow: none;
}
nav button:hover { color: var(--t); background: var(--s2); box-shadow: none; }
nav button.on {
  color: var(--au);
  background: linear-gradient(90deg, rgba(184,147,90,.1), transparent);
  padding-left: 34px;
}
nav button.on::before {
  content: "✦"; position: absolute; left: 16px; top: 50%;
  transform: translateY(-50%); color: var(--au); font-size: 10px;
}
nav a {
  color: var(--m); padding: 16px 24px; font-size: 13px;
  text-decoration: none; letter-spacing: .12em; text-transform: uppercase;
}

/* ── CARD ───────────────────────────── */
.card {
  display: flex; justify-content: space-between; gap: 10px;
  background: var(--s); border: 1px solid var(--ln);
  border-radius: var(--r); padding: 14px; margin: 8px 0;
  box-shadow: var(--sh1);
  transition: transform .2s, box-shadow .2s, border-color .2s;
  cursor: pointer;
}
.card:hover {
  transform: translateY(-1px); box-shadow: var(--sh2);
  border-color: rgba(184,147,90,.3);
}
small { display: block; color: var(--m); line-height: 1.4; }
.r { text-align: right; }
.lo { color: var(--no); } .ent { color: var(--ok); } .sai { color: var(--no); }

/* ── FORM ───────────────────────────── */
input, select, textarea {
  width: 100%; background: var(--s); color: var(--t);
  border: 1px solid var(--ln); border-radius: var(--r-sm);
  padding: 11px 12px; font: inherit; margin: 5px 0;
  transition: border-color .2s, box-shadow .2s;
}
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--au);
  box-shadow: 0 0 0 3px rgba(184,147,90,.12);
}
button {
  background: var(--g); color: #fff; border: 0; border-radius: var(--r-sm);
  padding: 11px 18px; font: inherit; font-weight: 400; font-size: 13px;
  letter-spacing: .1em; text-transform: uppercase; cursor: pointer;
  transition: background .2s, transform .1s, box-shadow .2s;
  box-shadow: var(--sh1);
}
button:hover { background: var(--au); box-shadow: var(--sh2); }
button:active { transform: translateY(1px); }
button.g {
  background: none; color: var(--g); border: 1px solid var(--au); box-shadow: none;
}
button.g:hover { background: rgba(184,147,90,.08); color: var(--au); box-shadow: none; }
@media (prefers-color-scheme:dark) { button.g { color: var(--au); } }
.row { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
.row > * { flex: 1; }

/* ── MODAL / SHEET ──────────────────── */
#m {
  display: none; position: fixed; inset: 0;
  background: rgba(10,20,14,.55);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  align-items: flex-end; z-index: 40;
}
#m.on { display: flex; animation: fadeIn .2s ease; }
.sh {
  background: var(--bg); width: 100%; max-height: 90%; overflow: auto;
  border-radius: 20px 20px 0 0;
  padding: 22px 18px calc(20px + env(safe-area-inset-bottom,0px));
  box-shadow: 0 -8px 40px rgba(0,0,0,.2);
  animation: slideUp .28s cubic-bezier(.4,0,.2,1);
  position: relative;
}
.sh::before {
  content: ""; position: absolute; top: 8px; left: 50%;
  transform: translateX(-50%); width: 40px; height: 4px;
  border-radius: 99px; background: var(--ln);
}
.sh h2 {
  margin: 8px 0 4px;
  font: 500 26px 'Cormorant Garamond', Georgia, serif;
  color: var(--g);
}
.sh h2::after {
  content: "✦"; display: block; color: var(--au);
  font-size: 12px; margin-top: 4px; line-height: 1;
}
@media (prefers-color-scheme:dark) { .sh h2 { color: var(--au); } }

/* ── STATS ──────────────────────────── */
.st { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
.st > div {
  background: var(--s); border: 1px solid var(--ln);
  border-radius: var(--r); padding: 14px; box-shadow: var(--sh1);
  display: flex; flex-direction: column; gap: 2px;
}
.st b {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 22px; font-weight: 500; color: var(--g); line-height: 1.2;
}
.st small {
  font-size: 10.5px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--m);
}
@media (prefers-color-scheme:dark) { .st b { color: var(--au); } }

/* ── LINE ───────────────────────────── */
.line {
  display: flex; justify-content: space-between; gap: 8px;
  padding: 9px 0; border-bottom: 1px solid var(--ln);
}
.line:last-child { border-bottom: 0; }

/* ── BADGE ──────────────────────────── */
.bd {
  display: inline-block; padding: 4px 10px; border-radius: 99px;
  background: var(--s2); font-size: 11px; font-weight: 500;
  letter-spacing: .06em; text-transform: uppercase;
  flex: none !important; white-space: nowrap;
}
.bd.no { background: var(--bdno); color: var(--no); }
.bd.ok { background: var(--bdok); color: var(--ok); }
.bd.am { color: var(--au); background: rgba(184,147,90,.12); }

/* ── LINK + SECTION TITLE ───────────── */
a { color: var(--au); text-decoration: none; transition: opacity .2s; }
a:hover { opacity: .75; }
#main h3 {
  margin: 22px 0 10px;
  font: 500 22px 'Cormorant Garamond', Georgia, serif;
  color: var(--g); display: block;
}
#main h3::after {
  content: "✦"; display: block; color: var(--au);
  font-size: 11px; margin-top: 4px; line-height: 1;
}
@media (prefers-color-scheme:dark) { #main h3 { color: var(--au); } }

/* ── EMPTY ──────────────────────────── */
.em {
  color: var(--m); text-align: center; padding: 40px 16px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  font-size: 14px;
}
.em::before {
  content: "✦"; display: block; font-size: 26px;
  color: var(--au); opacity: .55;
}

/* ── TOAST ──────────────────────────── */
#toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(92px + env(safe-area-inset-bottom,0px));
  background: var(--g); color: #fff; padding: 11px 22px;
  border-radius: 99px; z-index: 100; display: none;
  font-size: 13px; letter-spacing: .04em;
  box-shadow: 0 6px 20px rgba(0,0,0,.25);
  animation: toastIn .3s ease; max-width: 88vw; text-align: center;
}
@media (prefers-color-scheme:dark) { #toast { background: var(--au); color: var(--t); } }

/* ── WHATSAPP ───────────────────────── */
.wa {
  position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom,0px));
  z-index: 9; background: #25d366; color: #fff;
  width: 54px; height: 54px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 20px rgba(37,211,102,.35);
  text-decoration: none; font-size: 24px;
  transition: transform .2s, box-shadow .2s;
}
.wa:hover { transform: scale(1.06); box-shadow: 0 8px 24px rgba(37,211,102,.5); opacity: 1; }

/* ── ANIMAÇÕES ──────────────────────── */
@keyframes twinkle {
  0%,100% { opacity: 1; transform: scale(1); }
  50% { opacity: .55; transform: scale(.85); }
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes toastIn {
  from { opacity: 0; transform: translate(-50%, 10px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}

/* ── DESKTOP ────────────────────────── */
@media (min-width: 640px) {
  #m { align-items: center; justify-content: center; padding: 20px; }
  .sh { max-width: 560px; border-radius: var(--r); animation: scaleIn .22s ease; }
  .sh::before { display: none; }
  @keyframes scaleIn {
    from { transform: scale(.96); opacity: .8; }
    to { transform: scale(1); opacity: 1; }
  }
}
</style></head><body>

<div id="ov" onclick="mn()"></div>
<main id="main"></main>
<nav id="nav"></nav>
<div id="m"></div>

<script>
const K='lumine-v1';let D;
try{D=JSON.parse(localStorage.getItem(K))}catch(e){}
D=D||{p:[],c:[],v:[],x:[]};D.f=D.f||[];D.cx=D.cx||[];D.ped=D.ped||[];D.v.slice().reverse().forEach((s,k)=>{if(!s.n)s.n=k+1});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
const $=s=>document.querySelector(s);
const R=n=>'R$ '+(+n||0).toFixed(2).replace('.',',');
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const num=s=>parseFloat(String(s).replace(',','.'))||0;
const dt=d=>new Date(d).toLocaleDateString('pt-BR');
const v=i=>$('#'+i).value;
const empty=t=>`<div class="em">${t}</div>`;
const cn=i=>(D.c.find(c=>c.id==i)||{}).n||'Cliente avulso';
let tab='p',q='',cart=[],per='30';
const TABS=[['p','Produtos'],['k','Catálogo clientes'],['v','Vendas'],['x','Caixa'],['f','Finanças'],['c','Clientes'],['r','Relatórios']];

function modal(t,h,ok){$('#m').innerHTML=`<div class="sh"><h2>${t}</h2>${h}<div class="row"><button class="g" onclick="cl()">Cancelar</button><button onclick="${ok}">Salvar</button></div></div>`;$('#m').className='on'}
const cl=()=>{$('#m').className=''};

/* PRODUTOS */
let fo='';
function vp(){if(fo&&!D.p.some(p=>p.o==fo))fo='';const os=[...new Set(D.p.map(p=>p.o).filter(Boolean))],nb=fo?D.p.filter(p=>p.o==fo).length:D.p.length;return `<div class="row"><input id="bq" placeholder="Buscar peça ou código" value="${E(q)}" oninput="q=this.value;fl()"><button class="g" style="flex:none" onclick="scan(c=>{q=c;$('#bq').value=c;fl()})">📷</button></div>${os.length?`<select onchange="fo=this.value;go()"><option value="">Todos os clientes</option>${os.map(o=>`<option value="${E(o)}" ${o==fo?'selected':''}>${E(o)} (${D.p.filter(p=>p.o==o).length})</option>`).join('')}</select>`:''}<div class="row"><button onclick="pf()">Nova peça</button><button class="g" onclick="imp()">Importar lista</button></div><button class="g" style="width:100%;margin-bottom:6px" onclick="shk()">Compartilhar catálogo</button>${D.p.length?`<button class="g" style="width:100%;margin-bottom:6px" onclick="if(this.dataset.s)da();else{this.dataset.s=1;this.textContent='Toque de novo para apagar ${nb} peças'}">${fo?'Apagar peças de '+E(fo):'Apagar todo o estoque'}</button>`:''}<div id="lst"></div>`}
function da(){D.p=fo?D.p.filter(p=>p.o!=fo):[];fo='';save();go()}
function fl(){const l=D.p.filter(p=>(!fo||p.o==fo)&&(p.n+' '+p.k+' '+(p.o||'')).toLowerCase().includes(q.toLowerCase()));
$('#lst').innerHTML=l.length?l.map(p=>`<div class="card" onclick="pf('${p.id}')"><div style="display:flex;gap:10px">${p.f?`<img src="${p.f}" style="width:52px;height:52px;object-fit:cover;border-radius:8px;flex:none">`:''}<div><b>${E(p.n)}</b><small>${E(p.k)||'sem código'}</small><small>${E(p.g)||'sem categoria'}${p.o?' · '+E(p.o):''}</small></div></div><div class="r"><b>${R(p.pr)}</b><small class="${p.e<=2?'lo':''}">${p.e} em estoque</small></div></div>`).join(''):empty(D.p.length?'Nenhuma peça encontrada.':'Nenhuma peça ainda. Toque em Nova peça ou Importar lista.')}
function pf(i){const p=D.p.find(x=>x.id==i)||{k:'',n:'',g:'',c:'',pr:'',e:0};
pfoto=p.f||'';modal(i?'Editar peça':'Nova peça',`<div id="fp"></div><button class="g" style="width:100%" onclick="$('#ff').click()">📷 Foto da peça</button><input id="ff" type="file" accept="image/*" hidden onchange="ph(this)"><div class="row"><input id="fk" placeholder="Código" value="${E(p.k)}"><button class="g" style="flex:none" onclick="scan(c=>{$('#fk').value=c})">📷</button></div><input id="fn" placeholder="Nome da peça" value="${E(p.n)}"><input id="fg" placeholder="Categoria (brinco, colar...)" value="${E(p.g)}"><input id="fol" placeholder="Cliente / origem da nota" value="${E(p.o||'')}"><div class="row"><input id="fc" inputmode="decimal" placeholder="Custo" value="${p.c}"><input id="fpr" inputmode="decimal" placeholder="Preço de venda" value="${p.pr}"></div><input id="fe" type="number" placeholder="Estoque" value="${p.e}">${i?`<button class="g" onclick="if(this.dataset.s)dp('${i}');else{this.dataset.s=1;this.textContent='Confirmar exclusão'}">Excluir peça</button>`:''}`,`sp('${i||''}')`);pv()}
let pfoto='';
function ph(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);pfoto=c.toDataURL('image/jpeg',.7);pv()};im.src=r.result};r.readAsDataURL(f)}
function pv(){$('#fp').innerHTML=pfoto?`<img src="${pfoto}" style="width:100%;max-height:220px;object-fit:contain;border-radius:8px;margin-bottom:6px"><button class="g" style="width:100%" onclick="pfoto='';pv()">Remover foto</button>`:''}
let scT=null,scR=null;
function scx(){if(scT){scT.getTracks().forEach(t=>t.stop());scT=null}if(scR){try{scR.reset()}catch(e){}scR=null}const o=$('#sc');if(o)o.remove()}
async function scan(cb){scx();const o=document.createElement('div');o.id='sc';o.style.cssText='position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column';
o.innerHTML='<video id="sv" playsinline muted style="flex:1;min-height:0;width:100%;object-fit:cover"></video><div style="padding:14px;text-align:center"><small id="ss">Aponte para o código de barras</small><button class="g" style="margin-top:8px;width:100%" onclick="scx()">Cancelar</button></div>';document.body.appendChild(o);

return `<div class="card" onclick="cf('${c.id}')"><div><b>${E(c.n)}</b><small>${E(c.w)||'sem WhatsApp'}</small></div><div class="r"><b>${R(g)}</b><small>total em compras</small>${w?`<a href="https://wa.me/55${w}" target="_blank" onclick="event.stopPropagation()">WhatsApp</a>`:''}</div></div>`}).join('')||empty('Nenhum cliente cadastrado ainda.'))}
function cf(i){const c=D.c.find(x=>x.id==i)||{n:'',w:''};modal(i?'Editar cliente':'Novo cliente',`<input id="cn" placeholder="Nome" value="${E(c.n)}"><input id="cw" inputmode="tel" placeholder="WhatsApp com DDD" value="${E(c.w)}">${i?`<button class="g" onclick="if(this.dataset.s)dc('${i}');else{this.dataset.s=1;this.textContent='Confirmar exclusão'}">Excluir cliente</button>`:''}`,`sc('${i||''}')`)}
function sc(i){const o={n:v('cn'),w:v('cw')};if(!o.n)return;if(i)Object.assign(D.c.find(c=>c.id==i),o);else D.c.push({id:id(),...o});save();cl();go()}
function dc(i){D.c=D.c.filter(c=>c.id!=i);save();cl();go()}

/* RELATÓRIOS */
const MS=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
let rv={t:'f',y:new Date().getFullYear(),m:new Date().getMonth(),g:'d',bar:1,c:{f:1,b:1,l:1,e:1,s:1}};
const rg=()=>{const{y,m,g}=rv;return{n:g=='d'?new Date(y,m+1,0).getDate():12,k:d=>{d=new Date(d);return d.getFullYear()!=y||(g=='d'&&d.getMonth()!=m)?-1:g=='d'?d.getDate()-1:d.getMonth()}}};
function ser(){const{n,k}=rg(),z=()=>Array(n).fill(0),f=z(),b=z(),s=z(),e=z();
D.v.forEach(x=>{const i=k(x.d);if(i<0)return;f[i]+=x.t;b[i]+=x.i.reduce((a,j)=>a+j.q*(j.pr-j.c),0)});
D.x.forEach(x=>{const i=k(x.d);if(i<0)return;if(x.t=='s')s[i]+=x.v;else e[i]+=x.v});
return{f,b,l:b.map((v,i)=>v-s[i]),s,e}}
function ch(S,lb,bar){const W=340,H=190,P=22,n=lb.length,all=S.flatMap(s=>s.d),mx=Math.max(1,...all),mn=Math.min(0,...all),y=v=>H-P-(v-mn)/(mx-mn)*(H-P-8),w=(W-8)/n;
let o=`<svg viewBox="0 0 ${W} ${H}" style="width:100%">`;
for(let i=0;i<=3;i++){const yy=y(mn+(mx-mn)*i/3);o+=`<line x1="0" x2="${W}" y1="${yy}" y2="${yy}" stroke="#8a9486" stroke-opacity=".35" stroke-dasharray="4 4"/>`}
S.forEach((s,j)=>{if(bar){const bw=Math.max(1.5,(w-2)/S.length);s.d.forEach((v,i)=>{if(v)o+=`<rect x="${4+i*w+j*bw}" y="${Math.min(y(v),y(0))}" width="${bw-1}" height="${Math.abs(y(v)-y(0))}" fill="${s.c}"/>`})}else o+=`<polyline fill="none" stroke="${s.c}" stroke-width="2" points="${s.d.map((v,i)=>(4+i*w+w/2)+','+y(v)).join(' ')}"/>`});
lb.forEach((t,i)=>{if(n<=12||i%3==0)o+=`<text x="${4+i*w+w/2}" y="${H-6}" fill="#8a9486" font-size="9" text-anchor="middle">${t}</text>`});
return o+'</svg>'}
const ck=(k,n,c)=>`<label style="display:flex;align-items:center;gap:6px;color:${c}"><input type="checkbox" style="width:auto;margin:0" ${rv.c[k]?'checked':''} onchange="rv.c.${k}=this.checked;go()">${n}</label>`;
const rk=a=>{const mx=Math.max(1,...a.map(x=>x[1]));return a.map(([n,v,l])=>`<div class="line"><span>${E(n)}</span><span>${l}</span></div><div style="height:4px;background:var(--a);width:${v/mx*100}%;border-radius:2px"></div>`).join('')||'<div class="em">Sem dados no período.</div>'};
function vr(){const{y,m,g,t}=rv,{n,k}=rg(),inP=d=>k(d)>=0,y0=new Date().getFullYear(),lb=g=='d'?Array.from({length:n},(_,i)=>i+1):MS;
const op=(a,c)=>a.map(([x,l])=>`<option value="${x}"${c==x?' selected':''}>${l}</option>`).join('');
let h=`<select onchange="rv.t=this.value;go()">${op([['f','Faturamento'],['d','DRE'],['x','Caixa'],['t','Mais vendidos'],['c','Clientes']],t)}</select><div class="row"><select onchange="rv.y=+this.value;go()">${op([y0,y0-1,y0-2].map(a=>[a,a]),y)}</select>${g=='d'?`<select onchange="rv.m=+this.value;go()">${op(MS.map((a,i)=>[i,a]),m)}</select>`:''}<select onchange="rv.g=this.value;go()">${op([['d','Diário'],['m','Mensal']],g)}</select>${t=='f'||t=='x'?`<button class="g" onclick="rv.bar=!rv.bar;go()">${rv.bar?'Linhas':'Barras'}</button>`:''}</div>`;
if(t=='f'){const S=ser();h+=`<div class="row">${ck('f','Faturado','#8a9486')}${ck('b','Lucro bruto','#b8935a')}${ck('l','Lucro líquido','#5c8a4a')}</div>`+ch([['f','#8a9486'],['b','#b8935a'],['l','#5c8a4a']].filter(a=>rv.c[a[0]]).map(a=>({d:S[a[0]],c:a[1]})),lb,rv.bar)+`<div class="st"><div><small>Faturado</small><b>${R(S.f.reduce((a,b)=>a+b,0))}</b></div><div><small>Lucro líquido</small><b>${R(S.l.reduce((a,b)=>a+b,0))}</b></div></div>`}
else if(t=='x'){const S=ser();h+=`<div class="row">${ck('e','Entradas','#5c8a4a')}${ck('s','Saídas','#c0504d')}</div>`+ch([['e','#5c8a4a'],['s','#c0504d']].filter(a=>rv.c[a[0]]).map(a=>({d:S[a[0]],c:a[1]})),lb,rv.bar)+`<div class="st"><div><small>Entradas</small><b>${R(S.e.reduce((a,b)=>a+b,0))}</b></div><div><small>Saídas</small><b>${R(S.s.reduce((a,b)=>a+b,0))}</b></div></div>`}
else if(t=='d'){const V2=D.v.filter(x=>inP(x.d)),rec=V2.reduce((a,x)=>a+x.t,0),cmv=V2.reduce((a,x)=>a+x.i.reduce((b,j)=>b+j.q*j.c,0),0),des=D.x.filter(x=>x.t=='s'&&inP(x.d)).reduce((a,x)=>a+x.v,0);
h+=[['Receita bruta',rec],['(-) Custo das mercadorias',-cmv],['Lucro bruto',rec-cmv],['(-) Despesas (saídas do caixa)',-des],['Lucro líquido',rec-cmv-des]].map(([a,b],i)=>`<div class="line"${i%2==0?' style="font-weight:600"':''}><span>${a}</span><span class="${b<0?'sai':''}">${R(b)}</span></div>`).join('')}
else if(t=='t'){const tp={};D.v.filter(x=>inP(x.d)).forEach(s=>s.i.forEach(i=>{tp[i.n]=(tp[i.n]||0)+i.q}));h+=rk(Object.entries(tp).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([a,b])=>[a,b,b+' un']))}
else{const tc={};D.v.filter(x=>inP(x.d)).forEach(s=>{const c=cn(s.c);tc[c]=(tc[c]||0)+s.t});h+=rk(Object.entries(tc).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([a,b])=>[a,b,R(b)]))}
return h}
function vrOld(){const t0=new Date();t0.setHours(0,0,0,0);
const lim=per=='h'?+t0:per=='30'?Date.now()-2592e6:0;
const L=D.v.filter(s=>+new Date(s.d)>=lim);
const fat=L.reduce((s,x)=>s+x.t,0),luc=L.reduce((s,x)=>s+x.i.reduce((a,i)=>a+i.q*(i.pr-i.c),0),0);
const tp={};L.forEach(s=>s.i.forEach(i=>{tp[i.n]=(tp[i.n]||0)+i.q}));
const top=Object.entries(tp).sort((a,b)=>b[1]-a[1]).slice(0,5);
const bx=D.p.filter(p=>p.e<=2);
return `<div class="row">${[['h','Hoje'],['30','30 dias'],['0','Tudo']].map(([k,n])=>`<button class="${per==k?'':'g'}" onclick="per='${k}';go()">${n}</button>`).join('')}</div>
<div class="st"><div><small>Faturamento</small><b>${R(fat)}</b></div><div><small>Lucro</small><b>${R(luc)}</b></div><div><small>Vendas</small><b>${L.length}</b></div><div><small>Ticket médio</small><b>${R(L.length?fat/L.length:0)}</b></div></div>
<h3>Mais vendidas</h3>${top.map(([n,k])=>`<div class="line"><span>${E(n)}</span><span>${k}</span></div>`).join('')||'<small>Sem vendas no período.</small>'}
<h3>Estoque baixo</h3>${bx.map(p=>`<div class="line"><span>${E(p.n)}</span><span class="lo">${p.e}</span></div>`).join('')||'<small>Nenhuma peça com estoque baixo.</small>'}`}

/* FINANÇAS */
let fs={v:'r',s:'a',y:'',m:'',o:''};
const opt=(a,c)=>a.map(([x,l])=>`<option value="${x}"${String(c)==String(x)?' selected':''}>${l}</option>`).join('');
const hj=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const pgF=a=>a.pg.reduce((s,p)=>s+p.v,0),fltF=a=>Math.max(0,a.v-pgF(a)),stF=a=>fltF(a)<0.005?'q':a.d<hj()?'v':'a';
const fd=d=>{const[y,m,z]=d.split('-');return z+' '+MS[m-1]+' '+y};
const am=(d,k)=>{if(!k)return d;const[y,m,z]=d.split('-').map(Number),x=new Date(y,m-1+k,Math.min(z,28));return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const tg=i=>{fs.o=fs.o==i?'':i;go()};
const fa=x=>{if(x=='d'){rv.t='d';go('r')}else{fs.v=x;fs.o='';go()}};
function vf(){const{v:w,s,y,m,o}=fs,t=w=='p'?'p':'r',y0=new Date().getFullYear();
const L=D.f.filter(a=>a.t==t&&(w=='q'?stF(a)=='q':s=='t'||(s=='v'?stF(a)=='v':stF(a)!='q'))&&(!y||a.d.slice(0,4)==y)&&(m===''||+a.d.slice(5,7)-1==m)).sort((a,b)=>a.d<b.d?-1:1);
const tt=L.reduce((a,x)=>a+fltF(x),0);
let h=`<div class="row"><select onchange="fa(this.value)">${opt([['r','A receber'],['p','Dívidas'],['q','Recebidos'],['d','Demonstrativo (DRE)']],w)}</select>${w!='q'?`<select onchange="fs.s=this.value;go()">${opt([['a','Em aberto'],['v','Vencidas'],['t','Todas']],s)}</select>`:''}</div><div class="row"><select onchange="fs.y=this.value;go()"><option value="">Ano</option>${opt([y0-1,y0,y0+1].map(a=>[a,a]),y)}</select><select onchange="fs.m=this.value;go()"><option value="">Mês</option>${opt(MS.map((a,i)=>[i,a]),m)}</select></div>`;
if(w!='q')h+=`<button style="width:100%;margin:6px 0" onclick="ff('')">${t=='r'?'Nova conta a receber':'Nova dívida'}</button>`;
h+=`<div class="st"><div><small>${w=='q'?'Total recebido':t=='r'?'A receber':'A pagar'}</small><b>${R(w=='q'?L.reduce((a,x)=>a+x.v,0):tt)}</b></div><div><small>Lançamentos</small><b>${L.length}</b></div></div>`;
h+=L.map(a=>{const e=stF(a),ab=o==a.id,b=e=='q'?['QUITADA','ok']:e=='v'?['VENCIDA','no']:['EM ABERTO','am'];
return `<div class="card" style="display:block"><div class="row" style="justify-content:space-between" onclick="tg('${a.id}')"><span class="bd ${e=='v'?'no':''}">${fd(a.d)}</span><span class="bd ${b[1]}">${b[0]}</span><b class="r">${R(e=='q'?a.v:fltF(a))}</b></div><div style="margin-top:8px">${E(a.n)}${a.cl?`<small>${E(cn(a.cl))}</small>`:''}</div>${ab?`<div class="st"><div><small>Total</small><b>${R(a.v)}</b></div><div><small>Quitado</small><b>${R(pgF(a))}</b></div></div><div class="line"><span>Faltam</span><b class="${e=='v'?'sai':''}">${R(fltF(a))}</b></div>${a.pg.map(p=>`<div class="line"><small>${dt(p.d)}</small><span>${R(p.v)}</span></div>`).join('')}<div class="row" style="margin-top:10px">${e!='q'?`<button onclick="fp('${a.id}')">${t=='r'?'Receber':'Pagar'}</button>`:''}<button class="g" onclick="ff('${a.id}')">Editar</button></div>`:''}</div>`}).join('')||empty('Nada por aqui no período.');
return h}
function ff(i){const a=D.f.find(x=>x.id==i),t=a?a.t:(fs.v=='p'?'p':'r');
modal(a?'Editar conta':t=='r'?'Nova conta a receber':'Nova dívida',`<input id="fn2" placeholder="Descrição" value="${a?E(a.n):''}">${t=='r'?`<select id="fcl"><option value="">Sem cliente</option>${D.c.map(c=>`<option value="${c.id}"${a&&a.cl==c.id?' selected':''}>${E(c.n)}</option>`).join('')}</select>`:''}<div class="row"><input id="fv2" inputmode="decimal" placeholder="Valor total" value="${a?a.v:''}"><input id="fd2" type="date" value="${a?a.d:hj()}"></div>${a?'':`<small>Parcelas (mensais)</small><input id="fk2" type="number" min="1" value="1">`}${a?`<button class="g" onclick="if(this.dataset.s)dF('${i}');else{this.dataset.s=1;this.textContent='Confirmar exclusão'}">Excluir</button>`:''}`,`sf('${i||''}','${t}')`)}
function sf(i,t){const n=v('fn2'),tot=num(v('fv2')),d=v('fd2'),c0=$('#fcl')?v('fcl'):'';if(!n||tot<=0||!d)return;
if(i)Object.assign(D.f.find(a=>a.id==i),{n,v:tot,d,cl:c0});
else{const k=Math.max(1,Math.round(num(v('fk2'))));for(let j=0;j<k;j++)D.f.push({id:id(),t,n:k>1?n+' ('+(j+1)+'/'+k+')':n,cl:c0,v:Math.round(tot/k*100)/100,d:am(d,j),pg:[]})}
save();cl();go()}
function dF(i){D.f=D.f.filter(a=>a.id!=i);save();cl();go()}
function fp(i){const a=D.f.find(x=>x.id==i);modal(a.t=='r'?'Registrar recebimento':'Registrar pagamento',`<small>Faltam ${R(fltF(a))}</small><input id="fpv" inputmode="decimal" value="${fltF(a).toFixed(2).replace('.',',')}">`,`sg('${i}')`)}
function sg(i){const a=D.f.find(x=>x.id==i),x=Math.min(num(v('fpv')),fltF(a));if(x<=0)return;const d=new Date().toISOString();a.pg.push({d,v:x});D.x.unshift({id:id(),d,t:a.t=='r'?'e':'s',v:x,n:(a.t=='r'?'Recebimento - ':'Pagamento - ')+a.n});save();cl();go()}

function kh(){const b=atob($('#catb64').textContent.trim()),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);let h=new TextDecoder().decode(u);
const m=h.match(/(<script id="data" type="application\/json">)([\s\S]*?)(<\/script>)/);
if(m){try{const d=JSON.parse(m[2]);let sv=null;try{sv=JSON.parse(localStorage.getItem('lumine-catalogo')||'null')}catch(e){}
if(sv){if(sv.st)Object.assign(d.st,sv.st);if(sv.cats&&sv.cats.length)d.cats=sv.cats}
const nz=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/s$/,'');
const fc=g=>{const n=nz(g||'Outras');let c=d.cats.find(c=>nz(c.name)==n)||d.cats.find(c=>n&&(nz(c.name).includes(n)||n.includes(nz(c.name))));if(!c){c={id:'g'+Date.now().toString(36)+d.cats.length,name:(g||'Outras').trim().replace(/^./,x=>x.toUpperCase())};d.cats.push(c)}return c.id};
d.prods=D.p.map(p=>({id:'p'+p.id,name:p.n,code:p.k,cat:fc(p.g),desc:'',material:'',price:+p.pr||0,stock:+p.e||0,photos:p.f?[p.f]:[],isNew:false,featured:false,active:true}));
h=h.replace(m[0],()=>m[1]+JSON.stringify(d).replace(/</g,'\\u003c')+m[3])}catch(e){}}
return h}
function vk(){const h=kh().replace(/&/g,'&amp;').replace(/"/g,'&quot;');
return `<iframe srcdoc="${h}" style="display:block;width:calc(100% + 28px);margin:0 -14px;height:calc(100vh - 80px);border:0;background:#fff"></iframe>`}
async function shk(){const f=new File([kh()],'Catalogo_Lumine.html',{type:'text/html'});try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Catálogo Lumine'});return}}catch(e){if(e&&e.name=='AbortError')return}
const u=URL.createObjectURL(f),a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
const V={p:vp,k:vk,v:vv,x:vx,c:vc,r:vr,f:vf};
function go(t){if(t)tab=t;$('#main').innerHTML=V[tab]();if(tab=='p')fl();
$('#nav').innerHTML=TABS.map(([k,n])=>`<button class="${k==tab?'on':''}" onclick="go('${k}')">${n}</button>`).join('');$('#tt').textContent=TABS.find(x=>x[0]==tab)[1];$('#nav').classList.remove('o');$('#ov').classList.remove('o');window.scrollTo(0,0)}
function mn(){$('#nav').classList.toggle('o');$('#ov').classList.toggle('o')}
go();
</script></body></html>
