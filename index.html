<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Lumine</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   LUMINE — Design System
   ═══════════════════════════════════════════ */

:root {
  --g: #1f3d2b; --au: #b8935a; --bg: #fbf8f1; --s: #fff; --s2: #f3ede0;
  --t: #22301f; --m: #6c7568; --a: #b8935a; --ln: #e8e0cf;
  --ok: #4f7a3a; --no: #a63d3d; --bdno: #f6e2e0; --bdok: #e3eedc;
  --sh1: 0 1px 2px rgba(31,61,43,.06);
  --sh2: 0 4px 14px rgba(31,61,43,.08);
  --sh3: 0 12px 32px rgba(31,61,43,.14);
  --r: 12px; --r-sm: 8px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top,0px);
  padding-bottom: env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark) {
  :root {
    --g: #2f5a41; --bg: #101a14; --s: #17251c; --s2: #1f3026;
    --t: #efe9da; --m: #a3ad9f; --ln: #2a3a2f;
    --ok: #7fc8a0; --no: #e87c7c; --bdno: #4a2326; --bdok: #22382d;
    --sh1: 0 1px 2px rgba(0,0,0,.3);
    --sh2: 0 4px 14px rgba(0,0,0,.4);
    --sh3: 0 12px 32px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }

body {
  margin: 0;
  background: radial-gradient(circle at 20% -10%, rgba(184,147,90,.06), transparent 40%),
              radial-gradient(circle at 80% 110%, rgba(31,61,43,.05), transparent 40%),
              var(--bg);
  background-attachment: fixed;
  color: var(--t);
  font: 300 15px/1.55 Jost, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3 {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-weight: 500; letter-spacing: .02em; line-height: 1.15;
}

/* ── HEADER ─────────────────────────── */
header {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px;
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--ln);
  position: sticky; top: 0; z-index: 20;
}
#mb {
  background: none; color: var(--au); font-size: 24px; line-height: 1;
  padding: 6px 8px; flex: none; text-transform: none; letter-spacing: 0;
  border-radius: var(--r-sm); transition: background .2s;
}
#mb:hover { background: var(--s2); }
#ov {
  position: fixed; inset: 0; background: rgba(10,20,14,.55);
  backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
  z-index: 25; display: none;
}
#ov.o { display: block; animation: fadeIn .2s ease; }
header h1 {
  font: 500 30px/1 'Cormorant Garamond', Georgia, serif;
  color: var(--g); margin: 0; display: flex; align-items: center; gap: 8px;
  letter-spacing: .02em;
}
header h1::before {
  content: "✦"; color: var(--au); font-size: 18px;
  animation: twinkle 4s ease-in-out infinite;
}
@media (prefers-color-scheme:dark) { header h1 { color: var(--au); } }
header small {
  display: block; margin-top: 2px; letter-spacing: .35em;
  text-transform: uppercase; font-size: 9.5px; color: var(--m);
}
#tt {
  margin-left: auto; color: var(--m); font-weight: 400;
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-style: italic; font-size: 16px;
  max-width: 40%; text-align: right;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ── MAIN ───────────────────────────── */
main { padding: 18px 14px calc(92px + env(safe-area-inset-bottom,0px)); }

/* ── NAV ────────────────────────────── */
nav {
  position: fixed; top: 0; bottom: 0; left: 0; width: 260px; max-width: 82%;
  display: flex; flex-direction: column;
  background: var(--bg);
  background-image: radial-gradient(circle at 0% 0%, rgba(184,147,90,.08), transparent 50%);
  border-right: 1px solid var(--ln);
  padding: calc(env(safe-area-inset-top,0px) + 28px) 0 24px;
  z-index: 30; transform: translateX(-100%);
  transition: transform .28s cubic-bezier(.4,0,.2,1);
}
nav.o { transform: none; box-shadow: var(--sh3); }
nav button {
  background: none; border: 0; border-radius: 0; color: var(--m);
  padding: 16px 24px; font-size: 13px; font-weight: 400; text-align: left;
  letter-spacing: .12em; text-transform: uppercase;
  transition: color .2s, background .2s;
  position: relative; box-shadow: none;
}
nav button:hover { color: var(--t); background: var(--s2); box-shadow: none; }
nav button.on {
  color: var(--au);
  background: linear-gradient(90deg, rgba(184,147,90,.1), transparent);
  padding-left: 34px;
}
nav button.on::before {
  content: "✦"; position: absolute; left: 16px; top: 50%;
  transform: translateY(-50%); color: var(--au); font-size: 10px;
}
nav a {
  color: var(--m); padding: 16px 24px; font-size: 13px;
  text-decoration: none; letter-spacing: .12em; text-transform: uppercase;
}

/* ── CARD ───────────────────────────── */
.card {
  display: flex; justify-content: space-between; gap: 10px;
  background: var(--s); border: 1px solid var(--ln);
  border-radius: var(--r); padding: 14px; margin: 8px 0;
  box-shadow: var(--sh1);
  transition: transform .2s, box-shadow .2s, border-color .2s;
  cursor: pointer;
}
.card:hover {
  transform: translateY(-1px); box-shadow: var(--sh2);
  border-color: rgba(184,147,90,.3);
}
small { display: block; color: var(--m); line-height: 1.4; }
.r { text-align: right; }
.lo { color: var(--no); } .ent { color: var(--ok); } .sai { color: var(--no); }

/* ── FORM ───────────────────────────── */
input, select, textarea {
  width: 100%; background: var(--s); color: var(--t);
  border: 1px solid var(--ln); border-radius: var(--r-sm);
  padding: 11px 12px; font: inherit; margin: 5px 0;
  transition: border-color .2s, box-shadow .2s;
}
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--au);
  box-shadow: 0 0 0 3px rgba(184,147,90,.12);
}
button {
  background: var(--g); color: #fff; border: 0; border-radius: var(--r-sm);
  padding: 11px 18px; font: inherit; font-weight: 400; font-size: 13px;
  letter-spacing: .1em; text-transform: uppercase; cursor: pointer;
  transition: background .2s, transform .1s, box-shadow .2s;
  box-shadow: var(--sh1);
}
button:hover { background: var(--au); box-shadow: var(--sh2); }
button:active { transform: translateY(1px); }
button.g {
  background: none; color: var(--g); border: 1px solid var(--au); box-shadow: none;
}
button.g:hover { background: rgba(184,147,90,.08); color: var(--au); box-shadow: none; }
@media (prefers-color-scheme:dark) { button.g { color: var(--au); } }
.row { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
.row > * { flex: 1; }

/* ── MODAL / SHEET ──────────────────── */
#m {
  display: none; position: fixed; inset: 0;
  background: rgba(10,20,14,.55);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  align-items: flex-end; z-index: 40;
}
#m.on { display: flex; animation: fadeIn .2s ease; }
.sh {
  background: var(--bg); width: 100%; max-height: 90%; overflow: auto;
  border-radius: 20px 20px 0 0;
  padding: 22px 18px calc(20px + env(safe-area-inset-bottom,0px));
  box-shadow: 0 -8px 40px rgba(0,0,0,.2);
  animation: slideUp .28s cubic-bezier(.4,0,.2,1);
  position: relative;
}
.sh::before {
  content: ""; position: absolute; top: 8px; left: 50%;
  transform: translateX(-50%); width: 40px; height: 4px;
  border-radius: 99px; background: var(--ln);
}
.sh h2 {
  margin: 8px 0 4px;
  font: 500 26px 'Cormorant Garamond', Georgia, serif;
  color: var(--g);
}
.sh h2::after {
  content: "✦"; display: block; color: var(--au);
  font-size: 12px; margin-top: 4px; line-height: 1;
}
@media (prefers-color-scheme:dark) { .sh h2 { color: var(--au); } }

/* ── STATS ──────────────────────────── */
.st { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
.st > div {
  background: var(--s); border: 1px solid var(--ln);
  border-radius: var(--r); padding: 14px; box-shadow: var(--sh1);
  display: flex; flex-direction: column; gap: 2px;
}
.st b {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 22px; font-weight: 500; color: var(--g); line-height: 1.2;
}
.st small {
  font-size: 10.5px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--m);
}
@media (prefers-color-scheme:dark) { .st b { color: var(--au); } }

/* ── LINE ───────────────────────────── */
.line {
  display: flex; justify-content: space-between; gap: 8px;
  padding: 9px 0; border-bottom: 1px solid var(--ln);
}
.line:last-child { border-bottom: 0; }

/* ── BADGE ──────────────────────────── */
.bd {
  display: inline-block; padding: 4px 10px; border-radius: 99px;
  background: var(--s2); font-size: 11px; font-weight: 500;
  letter-spacing: .06em; text-transform: uppercase;
  flex: none !important; white-space: nowrap;
}
.bd.no { background: var(--bdno); color: var(--no); }
.bd.ok { background: var(--bdok); color: var(--ok); }
.bd.am { color: var(--au); background: rgba(184,147,90,.12); }

/* ── LINK + SECTION TITLE ───────────── */
a { color: var(--au); text-decoration: none; transition: opacity .2s; }
a:hover { opacity: .75; }
#main h3 {
  margin: 22px 0 10px;
  font: 500 22px 'Cormorant Garamond', Georgia, serif;
  color: var(--g); display: block;
}
#main h3::after {
  content: "✦"; display: block; color: var(--au);
  font-size: 11px; margin-top: 4px; line-height: 1;
}
@media (prefers-color-scheme:dark) { #main h3 { color: var(--au); } }

/* ── EMPTY ──────────────────────────── */
.em {
  color: var(--m); text-align: center; padding: 40px 16px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  font-size: 14px;
}
.em::before {
  content: "✦"; display: block; font-size: 26px;
  color: var(--au); opacity: .55;
}

/* ── TOAST ──────────────────────────── */
#toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(92px + env(safe-area-inset-bottom,0px));
  background: var(--g); color: #fff; padding: 11px 22px;
  border-radius: 99px; z-index: 100; display: none;
  font-size: 13px; letter-spacing: .04em;
  box-shadow: 0 6px 20px rgba(0,0,0,.25);
  animation: toastIn .3s ease; max-width: 88vw; text-align: center;
}
@media (prefers-color-scheme:dark) { #toast { background: var(--au); color: var(--t); } }

/* ── WHATSAPP ───────────────────────── */
.wa {
  position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom,0px));
  z-index: 9; background: #25d366; color: #fff;
  width: 54px; height: 54px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 20px rgba(37,211,102,.35);
  text-decoration: none; font-size: 24px;
  transition: transform .2s, box-shadow .2s;
}
.wa:hover { transform: scale(1.06); box-shadow: 0 8px 24px rgba(37,211,102,.5); opacity: 1; }

/* ── ANIMAÇÕES ──────────────────────── */
@keyframes twinkle {
  0%,100% { opacity: 1; transform: scale(1); }
  50% { opacity: .55; transform: scale(.85); }
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes toastIn {
  from { opacity: 0; transform: translate(-50%, 10px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}

/* ── DESKTOP ────────────────────────── */
@media (min-width: 640px) {
  #m { align-items: center; justify-content: center; padding: 20px; }
  .sh { max-width: 560px; border-radius: var(--r); animation: scaleIn .22s ease; }
  .sh::before { display: none; }
  @keyframes scaleIn {
    from { transform: scale(.96); opacity: .8; }
    to { transform: scale(1); opacity: 1; }
  }
}

/* ── IMPRESSÃO (ETIQUETA) ───────────── */
#pa{display:none}
@media print{
  html,body{background:#fff!important}
  body>*:not(#pa){display:none!important}
  #pa{display:block}
  .et{width:60mm;border:1px solid #000;padding:4mm;text-align:center;color:#000;break-inside:avoid}
  .et1{font:500 12pt 'Cormorant Garamond',Georgia,serif;letter-spacing:.2em}
  .et2{font:400 11pt Jost,sans-serif;margin:2mm 0}
  .et3{font:300 8pt Jost,sans-serif}
  .et4{font:600 20pt 'Cormorant Garamond',Georgia,serif;margin-top:1mm}
}

/* ── SINCRONIZAÇÃO ──────────────────── */
.syf{margin-top:auto;padding:16px 24px 0;border-top:1px solid var(--ln);display:flex;flex-direction:column;gap:2px}
nav .syf a{padding:8px 0;cursor:pointer}
.sy{letter-spacing:.06em;font-size:11px}.sy.ok{color:var(--ok)}.sy.err{color:var(--no)}.sy.wait{color:var(--au)}
#lg{display:none;position:fixed;inset:0;z-index:60;background:var(--bg);align-items:center;justify-content:center;padding:24px}
#lg.on{display:flex}
.lgc{width:100%;max-width:360px;display:flex;flex-direction:column;gap:8px;text-align:center}
.lgl{font:500 42px/1.1 'Cormorant Garamond',Georgia,serif;color:var(--g);margin-bottom:4px}
@media (prefers-color-scheme:dark){.lgl{color:var(--au)}}
.lgc a{margin-top:12px;font-size:13px;cursor:pointer}
#sb{display:none;position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--s);border:1px solid var(--no);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh3);align-items:center;gap:12px;font-size:13px}
#sb.on{display:flex}#sb button{flex:none;padding:8px 14px}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

function sched(){if(!SY.on)return;clearTimeout(pt);pt=setTimeout(push,600)}
function push(){pt=null;if(!SY.on||!db||PHL)return;const ops=[],ts=tsNow();
 COLS.forEach(c=>{const cur={};D[c].forEach(o=>{if(o.id==null)o.id=id();cur[String(o.id)]=o});
  for(const k in cur){const s=cj(cur[k]);if(SY.last[c][k]!==s)ops.push({c,k,s,t:'s'})}
  for(const k in SY.last[c])if(!(k in cur))ops.push({c,k,t:'d'})});
 if(!ops.length){if(!pendN){lsDel('lumine-pend');if(SY.st!='err')setStatus('ok','Sincronizado')}return}
 setStatus('wait','Sincronizando…');
 const parts=[];let cu=[],sz=0;ops.forEach(o=>{const l=(o.s||'').length;if(cu.length&&(cu.length>=400||sz+l>4e6)){parts.push(cu);cu=[];sz=0}cu.push(o);sz+=l});if(cu.length)parts.push(cu);
 for(const part of parts){const b=db.batch();
  part.forEach(o=>{const r=db.collection(pc(o.c)).doc(o.k);if(o.t=='s'){const d=JSON.parse(o.s);d._u=ts;b.set(r,d);SY.last[o.c][o.k]=o.s}else{b.set(r,{id:o.k,_x:1,_u:ts});delete SY.last[o.c][o.k]}});
  pendN++;
  b.commit().then(()=>{pendN--;if(!pendN&&!pt){lsDel('lumine-pend');if(SY.st!='err')setStatus('ok','Sincronizado')}}).catch(e=>{pendN--;lsSet('lumine-pend','1');fbErr(e)})}}
/* ═══ CATÁLOGO ONLINE · PUBLICAÇÃO ═══ */
const PUB={st:'',t:null,busy:false,again:false};
function pubInit(){return lsGet('lumine-pubh')?'Catálogo online publicado':'Catálogo online ainda não publicado'}
const pubSt=t=>{PUB.st=t;const e=$('#pubst');if(e)e.textContent=t};
function pubSched(){clearTimeout(PUB.t);if(!SY.on||!db)return;PUB.t=setTimeout(()=>pubNow(false),4000)}
function catPayload(){const b=catBase(),d=catFill(catBase()),st={};
 for(const k in d.st)if(cj(d.st[k])!==cj(b.st[k]))st[k]=d.st[k];
 const chunks=[];let cur=[],sz=0;
 d.prods.forEach(p=>{const l=JSON.stringify(p).length;if(cur.length&&sz+l>600000){chunks.push(cur);cur=[];sz=0}cur.push(p);sz+=l});
 if(cur.length||!chunks.length)chunks.push(cur);
 return{meta:{st,cats:d.cats,cup:d.cup,n:chunks.length,v:1},chunks}}
async function pubNow(force){
 if(!SY.on||!db){pubSt('Entre no app para publicar o catálogo');return}
 if(PUB.busy){PUB.again=true;return}
 PUB.busy=true;
 try{
  pubSt('Publicando…');
  const{meta,chunks}=catPayload();let H={};try{H=JSON.parse(lsGet('lumine-pubh')||'{}')}catch(e){}
  const ts=Date.now(),oldN=+H.n||0,col=db.collection('catalogo_pub');let w=0;
  const put=async(k,o)=>{const h=cj(o);if(!force&&H[k]===h)return;const d=JSON.parse(h);d._u=ts;await col.doc(k).set(d);H[k]=h;w++};
  let nx=0,dn=0;const run=async()=>{while(nx<chunks.length){const i=nx++;await put('c'+i,{items:chunks[i]});pubSt('Publicando '+(++dn)+'/'+chunks.length+'…')}};await Promise.all([run(),run(),run(),run()]);
  for(let i=chunks.length;i<oldN;i++){await col.doc('c'+i).set({items:[],_u:ts});delete H['c'+i];w++}
  await put('meta',meta);H.n=chunks.length;
  lsSet('lumine-pubh',JSON.stringify(H));
  pubSt(w?'Catálogo online atualizado':'Catálogo online em dia')
 }catch(e){pubSt('Não foi possível publicar o catálogo');fbErr(e)}
 PUB.busy=false;if(PUB.again){PUB.again=false;pubSched()}}
function pubUrl(){const u=prompt('Endereço do catálogo (ex.: https://usuario.github.io/catalogo/)',lsGet('lumine-url')||'');if(u!==null)lsSet('lumine-url',u.trim())}
async function pubLink(){let u=lsGet('lumine-url');if(!u){pubUrl();u=lsGet('lumine-url');if(!u)return}
 const t='Conheça o catálogo da Lumine Semijoias ✦';
 try{if(navigator.share){await navigator.share({title:'Lumine Semijoias',text:t,url:u});return}}catch(e){if(e&&e.name=='AbortError')return}
 window.open('https://wa.me/?text='+encodeURIComponent(t+' '+u),'_blank')}

go();fbInit();
</script></body></html>
