<style>

.row{display:flex;gap:8px;align-items:center;margin:6px 0}.row>*{flex:1}
#m{display:none;position:fixed;inset:0;background:#000b;align-items:flex-end;z-index:9}

.sh{background:var(--s);width:100%;max-height:90%;overflow:auto;border-radius:16px 16px 0 0;padding:16px}

.bd.no{background:#4a2326;color:var(--no)}.bd.ok{background:#22382d;color:var(--ok)}.bd.am{color:var(--a)}
a{color:var(--a)}h3{margin:16px 0 4px}
.em{color:var(--m);text-align:center;padding:30px 10px}
</style></head><body>
<header><h1>Lumine</h1><small>semi jóias</small></header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="m"></div>
<script>
const K='lumine-v1';let D;
try{D=JSON.parse(localStorage.getItem(K))}catch(e){}
D=D||{p:[],c:[],v:[],x:[]};D.f=D.f||[];D.cx=D.cx||[];D.v.slice().reverse().forEach((s,k)=>{if(!s.n)s.n=k+1});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
const $=s=>document.querySelector(s);
const R=n=>'R$ '+(+n||0).toFixed(2).replace('.',',');
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const num=s=>parseFloat(String(s).replace(',','.'))||0;
const dt=d=>new Date(d).toLocaleDateString('pt-BR');
const v=i=>$('#'+i).value;
const empty=t=>`<div class="em">${t}</div>`;
const cn=i=>(D.c.find(c=>c.id==i)||{}).n||'Cliente avulso';
let tab='p',q='',cart=[],per='30';
const TABS=[['p','Produtos'],['v','Vendas'],['x','Caixa'],['f','Finanças'],['c','Clientes'],['r','Relatórios']];

function modal(t,h,ok){$('#m').innerHTML=`<div class="sh"><h2>${t}</h2>${h}<div class="row"><button class="g" onclick="cl()">Cancelar</button><button onclick="${ok}">Salvar</button></div></div>`;$('#m').className='on'}
const cl=()=>{$('#m').className=''};

/* PRODUTOS */
let fo='';
function vp(){if(fo&&!D.p.some(p=>p.o==fo))fo='';const os=[...new Set(D.p.map(p=>p.o).filter(Boolean))],nb=fo?D.p.filter(p=>p.o==fo).length:D.p.length;return `<div class="row"><input id="bq" placeholder="Buscar peça ou código" value="${E(q)}" oninput="q=this.value;fl()"><button class="g" style="flex:none" onclick="scan(c=>{q=c;$('#bq').value=c;fl()})">📷</button></div>${os.length?`<select onchange="fo=this.value;go()"><option value="">Todos os clientes</option>${os.map(o=>`<option value="${E(o)}" ${o==fo?'selected':''}>${E(o)} (${D.p.filter(p=>p.o==o).length})</option>`).join('')}</select>`:''}<div class="row"><button onclick="pf()">Nova peça</button><button class="g" onclick="imp()">Importar lista</button></div>${D.p.length?`<button class="g" style="width:100%;margin-bottom:6px" onclick="if(this.dataset.s)da();else{this.dataset.s=1;this.textContent='Toque de novo para apagar ${nb} peças'}">${fo?'Apagar peças de '+E(fo):'Apagar todo o estoque'}</button>`:''}<div id="lst"></div>`}
function da(){D.p=fo?D.p.filter(p=>p.o!=fo):[];fo='';save();go()}
function fl(){const l=D.p.filter(p=>(!fo||p.o==fo)&&(p.n+' '+p.k+' '+(p.o||'')).toLowerCase().includes(q.toLowerCase()));
$('#lst').innerHTML=l.length?l.map(p=>`<div class="card" onclick="pf('${p.id}')"><div style="display:flex;gap:10px">${p.f?`<img src="${p.f}" style="width:52px;height:52px;object-fit:cover;border-radius:8px;flex:none">`:''}<div><b>${E(p.n)}</b><small>${E(p.k)||'sem código'}</small><small>${E(p.g)||'sem categoria'}${p.o?' · '+E(p.o):''}</small></div></div><div class="r"><b>${R(p.pr)}</b><small class="${p.e<=2?'lo':''}">${p.e} em estoque</small></div></div>`).join(''):empty(D.p.length?'Nenhuma peça encontrada.':'Nenhuma peça ainda. Toque em Nova peça ou Importar lista.')}
function pf(i){const p=D.p.find(x=>x.id==i)||{k:'',n:'',g:'',c:'',pr:'',e:0};
pfoto=p.f||'';modal(i?'Editar peça':'Nova peça',`<div id="fp"></div><button class="g" style="width:100%" onclick="$('#ff').click()">📷 Foto da peça</button><input id="ff" type="file" accept="image/*" hidden onchange="ph(this)"><div class="row"><input id="fk" placeholder="Código" value="${E(p.k)}"><button class="g" style="flex:none" onclick="scan(c=>{$('#fk').value=c})">📷</button></div><input id="fn" placeholder="Nome da peça" value="${E(p.n)}"><input id="fg" placeholder="Categoria (brinco, colar...)" value="${E(p.g)}"><input id="fol" placeholder="Cliente / origem da nota" value="${E(p.o||'')}"><div class="row"><input id="fc" inputmode="decimal" placeholder="Custo" value="${p.c}"><input id="fpr" inputmode="decimal" placeholder="Preço de venda" value="${p.pr}"></div><input id="fe" type="number" placeholder="Estoque" value="${p.e}">${i?`<button class="g" onclick="if(this.dataset.s)dp('${i}');else{this.dataset.s=1;this.textContent='Confirmar exclusão'}">Excluir peça</button>`:''}`,`sp('${i||''}')`);pv()}
let pfoto='';
function ph(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);pfoto=c.toDataURL('image/jpeg',.7);pv()};im.src=r.result};r.readAsDataURL(f)}
function pv(){$('#fp').innerHTML=pfoto?`<img src="${pfoto}" style="width:100%;max-height:220px;object-fit:contain;border-radius:8px;margin-bottom:6px"><button class="g" style="width:100%" onclick="pfoto='';pv()">Remover foto</button>`:''}
let scT=null,scR=null;
function scx(){if(scT){scT.getTracks().forEach(t=>t.stop());scT=null}if(scR){try{scR.reset()}catch(e){}scR=null}const o=$('#sc');if(o)o.remove()}
async function scan(cb){scx();const o=document.createElement('div');o.id='sc';o.style.cssText='position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column';
o.innerHTML='<video id="sv" playsinline muted style="flex:1;min-height:0;width:100%;object-fit:cover"></video><div style="padding:14px;text-align:center"><small id="ss">Aponte para o código de barras</small><button class="g" style="margin-top:8px;width:100%" onclick="scx()">Cancelar</button></div>';document.body.appendChild(o);
const vd=$('#sv'),ok=c=>{if(!$('#sc'))return;scx();cb(c)};
try{if('BarcodeDetector' in window){const bd=new BarcodeDetector({formats:['ean_13','ean_8','code_128','code_39','upc_a','upc_e','itf','qr_code']});
scT=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});vd.srcObject=scT;await vd.play();
const lp=async()=>{if(!scT)return;try{const r=await bd.detect(vd);if(r.length)return ok(r[0].rawValue)}catch(e){}setTimeout(lp,200)};lp()}
else{if(!window.ZXing)await new Promise((a,b)=>{const t=document.createElement('script');t.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';t.onload=a;t.onerror=b;document.head.appendChild(t)});
scR=new ZXing.BrowserMultiFormatReader();scR.decodeFromConstraints({video:{facingMode:'environment'}},vd,r=>{if(r)ok(r.getText())})}}
catch(e){const ss=$('#ss');if(ss)ss.textContent='Não foi possível abrir a câmera. Verifique a permissão (precisa de https).'}}
function sp(i){const o={k:v('fk'),n:v('fn'),g:v('fg'),c:num(v('fc')),pr:num(v('fpr')),e:Math.round(num(v('fe'))),f:pfoto,o:v('fol')};if(!o.n)return;
if(i)Object.assign(D.p.find(p=>p.id==i),o);else D.p.push({id:id(),...o});save();cl();go()}
function dp(i){D.p=D.p.filter(p=>p.id!=i);save();cl();go()}
function imp(){fotos={};modal('Importar lista',`<button class="g" style="width:100%" onclick="$('#fa').click()">📄 Importar PDF ou Excel</button><input id="fa" type="file" accept=".pdf,.xlsx,.xls,.csv" multiple hidden onchange="arq(this)"><small id="fs"></small><small>Uma peça por linha: código;nome;categoria;custo;preço;estoque;cliente (opcional)</small><textarea id="ft" rows="8" placeholder="B001;Brinco argola;Brinco;12,50;39,90;10"></textarea>`,'si()')}
const lib=u=>new Promise((a,b)=>{const t=document.createElement('script');t.src=u;t.onload=a;t.onerror=b;document.head.appendChild(t)});
let fotos={};
async function pimgs(pg){const o=await pg.getOperatorList(),O=pdfjsLib.OPS,mul=(m,n)=>[m[0]*n[0]+m[1]*n[2],m[0]*n[1]+m[1]*n[3],m[2]*n[0]+m[3]*n[2],m[2]*n[1]+m[3]*n[3],m[4]*n[0]+m[5]*n[2]+n[4],m[4]*n[1]+m[5]*n[3]+n[5]],r=[],st=[];let c=[1,0,0,1,0,0];
for(let i=0;i<o.fnArray.length;i++){const f=o.fnArray[i],a=o.argsArray[i];
if(f==O.save)st.push(c);else if(f==O.restore)c=st.pop()||[1,0,0,1,0,0];
else if(f==O.transform)c=mul(a,c);
else if(f==O.paintFormXObjectBegin){st.push(c);if(a&&a[0])c=mul(a[0],c)}else if(f==O.paintFormXObjectEnd)c=st.pop()||c;
else if(f==O.paintImageXObject||f==O.paintJpegXObject)r.push({n:a[0],x:Math.min(c[4],c[4]+c[0]),t:Math.max(c[5],c[5]+c[3])})}
return r}
async function pdat(pg,nm){const im=await new Promise(r=>pg.objs.get(nm,r));if(!im)return '';const W=im.width,H=im.height,s=Math.min(1,200/Math.max(W,H)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(W*s));c.height=Math.max(1,Math.round(H*s));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
let src;if(im.bitmap)src=im.bitmap;else{const t=document.createElement('canvas');t.width=W;t.height=H;const d=new ImageData(W,H),o=d.data,a=im.data;
if(a.length==W*H*4)o.set(a);else if(a.length==W*H*3){for(let i=0,j=0;i<a.length;i+=3,j+=4){o[j]=a[i];o[j+1]=a[i+1];o[j+2]=a[i+2];o[j+3]=255}}
else{const rb=(W+7)>>3;for(let y=0;y<H;y++)for(let X=0;X<W;X++){const v=(a[y*rb+(X>>3)]>>(7-(X&7)))&1?255:0,j=(y*W+X)*4;o[j]=o[j+1]=o[j+2]=v;o[j+3]=255}}
t.getContext('2d').putImageData(d,0,0);src=t}
x.drawImage(src,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.6)}
async function arq(inp){if(!inp.files.length)return;const fs=$('#fs'),all=[];let er=0;fs.textContent='Lendo arquivo...';
for(const f of inp.files){const n=f.name.toLowerCase();
try{let rows=[];const pgs=[];
if(n.endsWith('.pdf')){if(!window.pdfjsLib){await lib('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}
const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i),tc=await page.getTextContent(),ls={};tc.items.forEach(it=>{if(!it.str.trim())return;const y=Math.round(it.transform[5]/3);(ls[y]=ls[y]||[]).push([it.transform[4],it.str.trim(),it.transform[5]])});
Object.keys(ls).map(Number).sort((a,b)=>b-a).forEach(y=>{const r=ls[y].sort((a,b)=>a[0]-b[0]).map(x=>x[1]);r.y=ls[y][0][2];r.pg=i-1;rows.push(r)});
let im=[];try{im=await pimgs(page)}catch(e){}pgs.push({page,im})}}
else{if(!window.XLSX)await lib('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''})}
let L;const RX=/^[A-Z]{1,3}\d{3,}$/,pm=[];
if(rows.filter(r=>RX.test(String(r[0]).trim())).length>=3){const GR={AN:'Anel',AR:'Brinco',B9:'Brinco',BD:'Brinco',BP:'Brinco',BR:'Brinco',BT:'Brinco',CF:'Colar',CK:'Colar',CL:'Colar',CM:'Colar',CJ:'Conjunto',PF:'Pulseira',PI:'Pulseira',PM:'Pulseira',PG:'Pingente',TR:'Tornozeleira'};
L=[];rows.forEach((r,i)=>{const k=String(r[0]).trim();if(!RX.test(k))return;const u=r.findIndex((c,x)=>x>0&&String(c).trim()=='UN');if(u<2)return;const m=r.slice(u+1).join(' ').match(/^\s*(\d+)\s+R\$\s*([\d.]+,\d{2})/);if(!m)return;
let nome=r.slice(1,u).join(' ').replace(/\s+/g,' ').replace(/;/g,',').trim();const nx=rows[i+1],t=nx&&/^Un[ií]co/i.test(String(nx[0]))?String(nx.join(' ')).match(/TAM\s+(\d+)/):null;if(t&&k.startsWith('AN'))nome+=' (TAM '+t[1]+')';
L.push([k,nome,GR[k.slice(0,2)]||'','',m[2].replace(/\./g,''),m[1]].join(';'));pm.push([k,r])})}
else{let h=-1;rows.forEach((r,i)=>{if(h<0&&r.filter(c=>/c[oó]d|ref|nome|descri|produto|pre[cç]o|valor|custo|estoq|qtd|quant|categ/i.test(c)).length>=2)h=i});
let ix={k:0,n:1,g:2,c:3,pr:4,e:5};
if(h>=0){const H=rows[h].map(c=>String(c).toLowerCase()),fi=r=>H.findIndex(c=>r.test(c));ix={k:fi(/c[oó]d|ref/),n:fi(/nome|descri|produto|pe[cç]a/),g:fi(/categ|tipo|grupo/),c:fi(/custo/),pr:fi(/pre[cç]o|venda|valor/),e:fi(/estoq|qtd|quant/)};if(ix.n<0)ix.n=1}
const tx=(r,i)=>i<0?'':String(r[i]==null?'':r[i]).replace(/;/g,',').trim(),
nm=(r,i)=>{let t=tx(r,i).replace(/[^\d,.-]/g,'');if(t.includes(',')&&t.includes('.'))t=t.replace(/\./g,'');return t};
L=rows.slice(h+1).map(r=>[tx(r,ix.k),tx(r,ix.n),tx(r,ix.g),nm(r,ix.c),nm(r,ix.pr),nm(r,ix.e)].join(';')).filter(l=>l.split(';')[1]);
}
if(pm.length&&pgs.length){const us=new Set();for(const[k,r]of pm){const pg=pgs[r.pg];if(!pg||r.y==null)continue;const cd=pg.im.filter(m=>!us.has(m)&&m.x<150).map(m=>({m,d:Math.abs(m.t-r.y-11)})).sort((a,b)=>a.d-b.d)[0];if(cd&&cd.d<7){us.add(cd.m);try{const u=await pdat(pg.page,cd.m.n);if(u)fotos[k]=u}catch(e){}}}}
let cli='';rows.forEach((r,i)=>{if(!cli&&/^cliente$/i.test(String(r[0]).trim())&&rows[i+1])cli=String(rows[i+1][0]).replace(/^\(\d+\)\s*/,'').replace(/;/g,',').trim()});cli=cli||f.name.replace(/\.[^.]+$/,'').replace(/;/g,',');
L.forEach(l=>all.push(l+';'+cli))}
catch(e){er++}}
const ta=$('#ft');if(all.length)ta.value=(ta.value.trim()?ta.value.trim()+'\n':'')+all.join('\n');
fs.textContent=all.length?all.length+' linhas lidas'+(Object.keys(fotos).length?', '+Object.keys(fotos).length+' com foto':'')+'. Revise abaixo e toque em Salvar.'+(er?' ('+er+' arquivo(s) com erro)':''):(er?'Não foi possível ler o arquivo.':'Nenhuma peça encontrada no arquivo.')}
function si(){v('ft').split('\n').forEach(l=>{const a=l.split(/[;\t]/).map(s=>s.trim());if(a.length<2||!a[1])return;D.p.push({id:id(),k:a[0],n:a[1],g:a[2]||'',c:num(a[3]),pr:num(a[4]),e:Math.round(num(a[5])),o:a[6]||'',f:fotos[a[0]]||''})});fotos={};save();cl();go()}

/* VENDAS */
let vs={o:'r',y:'',m:'',e:''};
const vt=i=>{vs.e=vs.e==i?'':i;go()};
const va=x=>{if(x=='n')nv();else if(x=='g'){rv.t='f';go('r')}else if(x=='c')go('p')};
const vsts=s=>{if(!s.fid)return '';const a=D.f.find(x=>x.id==s.fid);return a&&stF(a)!='q'?'<span class="bd am">EM ABERTO</span>':''};
function vv(){const{o,y,m,e}=vs,y0=new Date().getFullYear();
let L=D.v.filter(s=>(!y||new Date(s.d).getFullYear()==y)&&(m===''||new Date(s.d).getMonth()==m));if(o!='r')L=L.slice().reverse();
let h=`<div class="row"><select onchange="vs.o=this.value;go()">${opt([['r','Recentes'],['a','Mais antigos']],o)}</select><select onchange="vs.y=this.value;go()"><option value="">Ano</option>${opt([y0-1,y0].map(a=>[a,a]),y)}</select><select onchange="vs.m=this.value;go()"><option value="">Mês</option>${opt(MS.map((a,i)=>[i,a]),m)}</select></div><select onchange="va(this.value);this.value=''"><option value="">Ações</option><option value="n">Nova venda</option><option value="g">Gráficos</option><option value="c">Catálogo</option></select>`;
h+=L.map(s=>`<div class="card" style="display:block"><div class="row" style="justify-content:space-between" onclick="vt('${s.id}')"><span class="bd am">N. ${s.n}</span><span class="bd">${dh(s.d)}</span></div><div class="row" style="justify-content:flex-start;margin-top:8px"><span class="bd ok" style="font-size:15px">${R(s.t)}</span>${vsts(s)}<span>${E(cn(s.c))}</span></div>${e==s.id?`<div style="margin-top:8px">${s.i.map(j=>`<div class="line"><span>${j.q}x ${E(j.n)}</span><span>${R(j.q*j.pr)}</span></div>`).join('')}<div class="line"><span>Pagamento</span><span>${E(s.f)}</span></div><button class="g" style="width:100%;margin-top:10px" onclick="dv('${s.id}')">Devolução</button></div>`:''}</div>`).join('')||empty('Nenhuma venda registrada ainda.');
return `<button style="width:100%;margin:6px 0" onclick="nv()">Nova venda</button>`+h}

return `<div class="card" style="display:block"><div class="row" style="justify-content:space-between" onclick="tg('${a.id}')"><span class="bd ${e=='v'?'no':''}">${fd(a.d)}</span><span class="bd ${b[1]}">${b[0]}</span><b class="r">${R(e=='q'?a.v:fltF(a))}</b></div><div style="margin-top:8px">${E(a.n)}${a.cl?`<small>${E(cn(a.cl))}</small>`:''}</div>${ab?`<div class="st"><div><small>Total</small><b>${R(a.v)}</b></div><div><small>Quitado</small><b>${R(pgF(a))}</b></div></div><div class="line"><span>Faltam</span><b class="${e=='v'?'sai':''}">${R(fltF(a))}</b></div>${a.pg.map(p=>`<div class="line"><small>${dt(p.d)}</small><span>${R(p.v)}</span></div>`).join('')}<div class="row" style="margin-top:10px">${e!='q'?`<button onclick="fp('${a.id}')">${t=='r'?'Receber':'Pagar'}</button>`:''}<button class="g" onclick="ff('${a.id}')">Editar</button></div>`:''}</div>`}).join('')||empty('Nada por aqui no período.');
return h}
function ff(i){const a=D.f.find(x=>x.id==i),t=a?a.t:(fs.v=='p'?'p':'r');
modal(a?'Editar conta':t=='r'?'Nova conta a receber':'Nova dívida',`<input id="fn2" placeholder="Descrição" value="${a?E(a.n):''}">${t=='r'?`<select id="fcl"><option value="">Sem cliente</option>${D.c.map(c=>`<option value="${c.id}"${a&&a.cl==c.id?' selected':''}>${E(c.n)}</option>`).join('')}</select>`:''}<div class="row"><input id="fv2" inputmode="decimal" placeholder="Valor total" value="${a?a.v:''}"><input id="fd2" type="date" value="${a?a.d:hj()}"></div>${a?'':`<small>Parcelas (mensais)</small><input id="fk2" type="number" min="1" value="1">`}${a?`<button class="g" onclick="if(this.dataset.s)dF('${i}');else{this.dataset.s=1;this.textContent='Confirmar exclusão'}">Excluir</button>`:''}`,`sf('${i||''}','${t}')`)}
function sf(i,t){const n=v('fn2'),tot=num(v('fv2')),d=v('fd2'),c0=$('#fcl')?v('fcl'):'';if(!n||tot<=0||!d)return;
if(i)Object.assign(D.f.find(a=>a.id==i),{n,v:tot,d,cl:c0});
else{const k=Math.max(1,Math.round(num(v('fk2'))));for(let j=0;j<k;j++)D.f.push({id:id(),t,n:k>1?n+' ('+(j+1)+'/'+k+')':n,cl:c0,v:Math.round(tot/k*100)/100,d:am(d,j),pg:[]})}
save();cl();go()}
function dF(i){D.f=D.f.filter(a=>a.id!=i);save();cl();go()}
function fp(i){const a=D.f.find(x=>x.id==i);modal(a.t=='r'?'Registrar recebimento':'Registrar pagamento',`<small>Faltam ${R(fltF(a))}</small><input id="fpv" inputmode="decimal" value="${fltF(a).toFixed(2).replace('.',',')}">`,`sg('${i}')`)}
function sg(i){const a=D.f.find(x=>x.id==i),x=Math.min(num(v('fpv')),fltF(a));if(x<=0)return;const d=new Date().toISOString();a.pg.push({d,v:x});D.x.unshift({id:id(),d,t:a.t=='r'?'e':'s',v:x,n:(a.t=='r'?'Recebimento - ':'Pagamento - ')+a.n});save();cl();go()}

const V={p:vp,v:vv,x:vx,c:vc,r:vr,f:vf};
function go(t){if(t)tab=t;$('#main').innerHTML=V[tab]();if(tab=='p')fl();
$('#nav').innerHTML=TABS.map(([k,n])=>`<button class="${k==tab?'on':''}" onclick="go('${k}')">${n}</button>`).join('');window.scrollTo(0,0)}
go();
</script></body></html>
